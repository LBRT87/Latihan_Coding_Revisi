services:
  service:
    restart: on-failure
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      pgpool:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    networks:
      - eskrim
  
  postgres-master:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_REPLICATION_MODE: master
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_master_data:/bitnami/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - eskrim
  
  postgres-slave:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_MASTER_POST_NUMBER: 5432
    volumes:
      - postgres_slave_data:/bitnami/postgresql
    depends_on:
      postgres-master:
        condition: service_healthy
    networks:
      - eskrim

  pgpool:
    image: mrgreen007/pgpool:latest
    environment:
      PGPOOL_BACKEND_NODES: 0:postgres-master:5432,1:postgres-slave:5432
      PGPOOL_SR_CHECK_USER: repl_user
      PGPOOL_SR_CHECK_PASSWORD: repl_password
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: postgres
      PGPOOL_ADMIN_USERNAME: admin_user
      PGPOOL_ADMIN_PASSWORD: admin_password
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-slave:
        condition: service_started
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"
    networks:
      - eskrim
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - eskrim
    
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - eskrim

  # seeweed-master:


networks:
  eskrim:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_master_data:
  postgres_slave_data: